name: Deploy Eunsung MES to Jisung Development

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - build_only
          - activate_existing
          - rollback_test
      target_release_sha:
        description: Existing older main SHA used only by rollback_test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eunsung-jisung-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: jisung-development
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GITHUB_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
      TARGET_RELEASE_SHA: ${{ inputs.target_release_sha || '' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      REMOTE_DEPLOY_ROOT_WIN: 'D:\Project\SMT_EUNSUNG\.deploy'
      REMOTE_INCOMING_ROOT_SCP: '/D:/Project/SMT_EUNSUNG/.deploy/incoming'

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable deployment inputs
        id: deployment
        run: |
          set -euo pipefail
          readonly full_sha_pattern='^[0-9a-f]{40}$'
          [[ "$GITHUB_SHA" =~ $full_sha_pattern ]] || { echo 'The triggering commit is not a lowercase full SHA.' >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo 'The triggering commit is not on origin/main.' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo 'DEPLOY_PORT must be a valid TCP port.' >&2; exit 1; }
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && "$DEPLOY_HOST" != -* && "$DEPLOY_USER" != -* ]] || { echo 'Invalid SSH host or user.' >&2; exit 1; }
          case "$DEPLOY_MODE" in
            deploy|build_only|activate_existing) deploy_sha="$GITHUB_SHA" ;;
            rollback_test)
              [[ "$TARGET_RELEASE_SHA" =~ $full_sha_pattern ]] || { echo 'rollback_test requires a lowercase full SHA.' >&2; exit 1; }
              [[ "$TARGET_RELEASE_SHA" != "$GITHUB_SHA" ]] || { echo 'rollback_test must target an older release.' >&2; exit 1; }
              git cat-file -e "${TARGET_RELEASE_SHA}^{commit}"
              git merge-base --is-ancestor "$TARGET_RELEASE_SHA" refs/remotes/origin/main || { echo 'Rollback target is not on origin/main.' >&2; exit 1; }
              deploy_sha="$TARGET_RELEASE_SHA"
              ;;
            *) echo 'Unsupported deployment mode.' >&2; exit 1 ;;
          esac
          [[ "$DEPLOY_MODE" == rollback_test || -z "$TARGET_RELEASE_SHA" ]] || { echo 'target_release_sha is accepted only for rollback_test.' >&2; exit 1; }
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "incoming_win=${REMOTE_DEPLOY_ROOT_WIN}\\incoming\\${deploy_sha}" >> "$GITHUB_OUTPUT"

      - name: Create exact-SHA release archive
        if: ${{ env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'build_only' }}
        env:
          DEPLOY_SHA: ${{ steps.deployment.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          git archive --format=zip --output="eunsung-${GITHUB_SHA}.zip" "$GITHUB_SHA"
          test "$DEPLOY_SHA" = "$GITHUB_SHA"
          test -s "eunsung-${DEPLOY_SHA}.zip"

      - name: Configure key-only SSH
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/eunsung-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/eunsung-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" | tr -d '\r' > "$RUNNER_TEMP/eunsung-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/eunsung-ssh/id_ed25519" "$RUNNER_TEMP/eunsung-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/eunsung-ssh/id_ed25519" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/eunsung-ssh/known_hosts" >/dev/null

      - name: Stage reviewed deployment payload
        env:
          DEPLOY_SHA: ${{ steps.deployment.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          readonly bundle="$RUNNER_TEMP/eunsung-incoming/$DEPLOY_SHA"
          install -d -m 700 "$bundle"
          install -m 600 scripts/deploy/windows/Deploy-EunsungRelease.ps1 "$bundle/Deploy-EunsungRelease.ps1"
          install -m 600 scripts/deploy/windows/EunsungDeployment.psm1 "$bundle/EunsungDeployment.psm1"
          install -m 600 scripts/deploy/windows/Test-EunsungDeployment.ps1 "$bundle/Test-EunsungDeployment.ps1"
          if [[ "$DEPLOY_MODE" == deploy || "$DEPLOY_MODE" == build_only ]]; then
            install -m 600 "eunsung-${GITHUB_SHA}.zip" "$bundle/eunsung-${GITHUB_SHA}.zip"
          fi

      - name: Upload to the SHA-specific incoming directory
        env:
          DEPLOY_SHA: ${{ steps.deployment.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          scp_options=(-i "$RUNNER_TEMP/eunsung-ssh/id_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/eunsung-ssh/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          scp "${scp_options[@]}" -r -- "$RUNNER_TEMP/eunsung-incoming/$DEPLOY_SHA" "$DEPLOY_USER@$DEPLOY_HOST:${REMOTE_INCOMING_ROOT_SCP}/"

      - name: Run transactional deployment
        env:
          DEPLOY_SHA: ${{ steps.deployment.outputs.deploy_sha }}
          INCOMING_WIN: ${{ steps.deployment.outputs.incoming_win }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/eunsung-ssh/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/eunsung-ssh/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          remote_args="-CommitSha $DEPLOY_SHA -CleanupIncoming"
          case "$DEPLOY_MODE" in
            deploy) remote_args="$remote_args -ArchivePath ${INCOMING_WIN}\\eunsung-${GITHUB_SHA}.zip" ;;
            build_only) remote_args="$remote_args -ArchivePath ${INCOMING_WIN}\\eunsung-${GITHUB_SHA}.zip -BuildOnly" ;;
            activate_existing) remote_args="$remote_args -ActivateExisting" ;;
            rollback_test) remote_args="$remote_args -ActivateExisting -InjectHealthFailure -AllowFailureInjection" ;;
          esac
          set +e
          ssh "${ssh_options[@]}" -- "$DEPLOY_USER@$DEPLOY_HOST" "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ${INCOMING_WIN}\\Deploy-EunsungRelease.ps1 $remote_args"
          deploy_status=$?
          set -e
          if [[ "$DEPLOY_MODE" == rollback_test ]]; then
            (( deploy_status == 30 )) || { echo "Rollback test returned unexpected status: $deploy_status" >&2; exit 1; }
            echo 'Rollback injection restored the captured release as expected.'
          elif (( deploy_status != 0 )); then
            echo "Remote deployment failed with status: $deploy_status" >&2
            exit "$deploy_status"
          fi

      - name: Remove local SSH material
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/eunsung-ssh/id_ed25519" "$RUNNER_TEMP/eunsung-ssh/known_hosts"
